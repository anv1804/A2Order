upstream a2order_server {
    server server:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Client body limit
    client_max_body_size 10M;

    # Health check passthrough
    location /health {
        proxy_pass http://a2order_server/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Ready check passthrough
    location /ready {
        proxy_pass http://a2order_server/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Backend REST API
    location /api/ {
        proxy_pass http://a2order_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Realtime WebSocket (Socket.io)
    location /socket.io/ {
        proxy_pass http://a2order_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # CMS Management & Admin Portal
    location ^~ /cms/ {
        alias /usr/share/nginx/html/cms/;
        index index.html;
        try_files $uri $uri/ /cms/index.html;

        # Static assets cache
        location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Client Web POS & QR Customer Ordering
    location / {
        root /usr/share/nginx/html/client;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Static assets cache
        location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
