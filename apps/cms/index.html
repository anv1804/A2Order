<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo-symbol.jpg" />
    <link rel="apple-touch-icon" href="/logo-symbol.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#12372A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>A2Order - Hệ Thống Vận Hành & Quản Trị Nhà Hàng</title>
    <style>
      /* Chống chớp trắng (FOUC) khi app đang tải bundle */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #F4F5F6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
      }
      .loader-logo {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        object-fit: cover;
        box-shadow: 0 10px 25px rgba(18, 55, 42, 0.15);
        margin-bottom: 16px;
        animation: pulseLogo 2s infinite ease-in-out;
      }
      .loader-title {
        font-size: 18px;
        font-weight: 900;
        color: #161918;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .loader-sub {
        font-size: 11px;
        color: #69706D;
        margin-top: 4px;
        font-weight: 600;
      }
      .loader-bar {
        width: 140px;
        height: 4px;
        background-color: #E3E5E5;
        border-radius: 999px;
        margin-top: 18px;
        overflow: hidden;
        position: relative;
      }
      .loader-bar-fill {
        width: 45%;
        height: 100%;
        background-color: #12372A;
        border-radius: 999px;
        animation: barSlide 1.2s infinite ease-in-out;
      }
      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes barSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body class="bg-surface-canvas text-ink-primary antialiased select-none">
    <div id="root">
      <!-- Fallback loader styled identically to Donezo theme before bundle execution -->
      <div id="initial-loader">
        <img src="/logo-symbol.jpg" alt="A2Order" class="loader-logo" />
        <h1 class="loader-title">A2Order <span style="color: #22604B;">OS</span></h1>
        <p class="loader-sub">Hệ thống quản lý thông minh</p>
        <div class="loader-bar">
          <div class="loader-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
